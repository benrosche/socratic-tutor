# Railway service config. Read when the service's Root Directory is `/server`,
# which is the supported configuration — everything the deploy needs lives in
# this directory.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node dist/index.js"
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
