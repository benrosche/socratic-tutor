# Railway service config.
#
# IMPORTANT: set the service's Root Directory to `server`. Without it the builder
# analyzes the repo root, finds no package.json, and fails with "could not
# determine how to build the app" — this file is never even read.
[build]
# `--include=dev` is deliberate: TypeScript is a devDependency and the build needs
# it. Railway sets NODE_ENV=production, under which a plain `npm ci` skips dev
# dependencies and `tsc` is then missing at build time.
buildCommand = "npm ci --include=dev && npm run build"

[deploy]
startCommand = "npm start"
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
