# Railway service config, at the repo root so it is read with the service's
# "Root Directory" setting left blank. The Dockerfile handles locating the server
# under server/, which makes the deploy independent of that setting — leaving it
# unset is the supported configuration.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node dist/index.js"
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
